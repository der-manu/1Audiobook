name: Release

# Wird gestartet, wenn du einen Tag wie v1.0.0-rc.1 pushst (siehe docs/RELEASE.md).
# Von Hand ("Run workflow") baut er nur und legt das APK als Artefakt ab, ohne ein Release zu veroeffentlichen.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle (mit Cache)
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew ausfuehrbar machen
        run: chmod +x gradlew

      # Der Schluessel liegt als Base64-Text in einem GitHub-Secret und wird nur fuer diesen Lauf in eine Datei geschrieben.
      - name: Signierschluessel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Das Secret RELEASE_KEYSTORE_BASE64 fehlt. Siehe docs/RELEASE.md, Schritt 1."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Release-APK bauen und signieren
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK pruefen und benennen
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "Gefunden: $APK"
          case "$APK" in
            *unsigned*) echo "::error::Das APK ist nicht signiert. Pruefe die vier Secrets."; exit 1;;
          esac
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK"
          OUT="1Audiobook-${GITHUB_REF_NAME}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"

      - name: APK als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: 1Audiobook-release
          path: |
            ${{ env.APK_FILE }}
            ${{ env.APK_FILE }}.sha256

      - name: GitHub-Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK_FILE }}
            ${{ env.APK_FILE }}.sha256
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          generate_release_notes: true
