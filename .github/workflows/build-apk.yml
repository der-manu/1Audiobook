name: Build debug APK

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Der Build verlangt eine JDK-17-Toolchain und laedt kein JDK mehr nach.
      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle (mit Cache)
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew ausfuehrbar machen
        run: chmod +x gradlew

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: 1Audiobook-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
